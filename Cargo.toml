[package]
name = "herdr-agent-quota"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Herdr plugin for Claude Code, Codex, and Grok subscription quota"
license = "MIT"
repository = "https://github.com/levi-qiao/herdr-agent-quota"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "5.0"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml_edit = "0.22"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.14"

[[bin]]
name = "herdr-agent-quota"
path = "src/main.rs"
